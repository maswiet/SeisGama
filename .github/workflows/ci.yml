name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: SeisGama-Linux.tar.gz
          - os: windows-latest
            asset: SeisGama-Windows.zip
          - os: macos-latest
            asset: SeisGama-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[build]"
      - run: python packaging/build.py
      - name: Smoke test of the frozen executable (command line mode)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXE=dist/SEISGAMA.app/Contents/MacOS/SEISGAMA; \
          elif [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/SEISGAMA/SEISGAMA.exe; else EXE=dist/SEISGAMA/SEISGAMA; fi
          "$EXE" synthetic smoke.sgy
          "$EXE" qc smoke.sgy -o smoke_qc
          test -f smoke_qc/smoke_qc_report.txt
      - name: Package
        shell: bash
        run: |
          cp LICENSE README.md CITATION.cff dist/
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent SEISGAMA.app ../${{ matrix.asset }}
            zip -j ../${{ matrix.asset }} LICENSE README.md CITATION.cff
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../${{ matrix.asset }} SEISGAMA LICENSE README.md CITATION.cff
          else
            tar czf ../${{ matrix.asset }} SEISGAMA LICENSE README.md CITATION.cff
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            Ready-to-run SeisGama applications for Windows, macOS (Apple Silicon) and Linux.
            Download the file for your system, extract it and start SEISGAMA (see README).

            License: CC BY-NC 4.0 (non-commercial use). For commercial use contact ws@ugm.ac.id.
            Please cite: Irnaka et al. (2018), SEISGAMA: A Free C# Based Seismic Data Processing
            Software Platform, International Journal of Geophysics, 2018, 2913591.
            https://doi.org/10.1155/2018/2913591
